<!-- templates/edit_user.html -->
{% extends "base.html" %} {% block content %}
<div class="min-h-screen bg-gray-50 p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <div class="bg-white rounded-xl shadow p-6">
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-gray-900">Edit User: {{ user.full_name }}</h2>
                <p class="text-gray-600">Update user information and permissions</p>
            </div>

            <form method="POST">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                        <input type="text" name="full_name" value="{{ user.full_name }}" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" name="email" value="{{ user.email }}" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Department</label>
                        <select name="department_id" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
              <option value="">Select Department</option>
              {% for dept in departments %}
              <option value="{{ dept.id }}" {% if user.department_id == dept.id %}selected{% endif %}>
                {{ dept.name }}
              </option>
              {% endfor %}
            </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                        <div class="mt-1">
                            <label class="inline-flex items-center">
                <input type="checkbox" name="is_active" class="rounded border-gray-300 text-indigo-600 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50" 
                       {% if user.is_active %}checked{% endif %}>
                <span class="ml-2 text-sm text-gray-700">Active User</span>
              </label>
                        </div>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Roles</label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                        {% for role in all_roles %}
                        <div>
                            <label class="inline-flex items-center">
                <input type="checkbox" name="roles" value="{{ role.id }}" 
                       class="rounded border-gray-300 text-indigo-600 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50"
                       {% if role.id in user_roles %}checked{% endif %}>
                <span class="ml-2 text-sm text-gray-700">{{ role.name }}</span>
              </label>
                        </div>
                        {% endfor %}
                    </div>
                </div>

                <div class="flex justify-end space-x-3">
                    <a href="{{ url_for('user_management_web.manage_users') }}" class="px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
            Cancel
          </a>
                    <button type="submit" class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
            Save Changes
          </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
