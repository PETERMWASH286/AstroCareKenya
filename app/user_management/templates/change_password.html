<!-- templates/change_password.html -->
{% extends "base.html" %} {% block content %}
<div class="min-h-screen bg-gray-50 p-4 md:p-8">
    <div class="max-w-md mx-auto">
        <div class="bg-white rounded-xl shadow p-6">
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-gray-900">Change Password</h2>
                <p class="text-gray-600">For user: {{ user.full_name }}</p>
            </div>

            <form method="POST">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
                    <input type="password" name="new_password" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" required>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                    <input type="password" name="confirm_password" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" required>
                </div>

                <div class="flex justify-end space-x-3">
                    <a href="{{ url_for('user_management_web.manage_users') }}" class="px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
            Cancel
          </a>
                    <button type="submit" class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
            Update Password
          </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
