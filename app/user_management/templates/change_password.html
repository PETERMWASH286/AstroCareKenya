<!-- templates/change_password.html -->
{% extends "base.html" %}

{% block title %}Change Password{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-100 dark:bg-gray-900 flex items-center justify-center py-10 px-4">
    <div class="w-full max-w-md">
        <div class="bg-white dark:bg-gray-800 shadow-2xl rounded-2xl p-8 transition-transform transform ">
            
            <!-- Header -->
            <div class="mb-8 text-center">
                <h2 class="text-3xl font-extrabold text-gray-900 dark:text-white mb-2">Change Password</h2>
                <p class="text-gray-500 dark:text-gray-300 text-sm">User: <span class="font-medium text-gray-700 dark:text-gray-200">{{ user.full_name }}</span></p>
            </div>

            <!-- Form -->
            <form method="POST" class="space-y-6">
                
                <!-- New Password -->
                <div class="relative">
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">New Password</label>
                    <input type="password" name="new_password" id="new_password" 
                        class="peer w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 shadow-sm transition" 
                        required>
                    <button type="button" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 dark:text-gray-300 hover:text-indigo-500 focus:outline-none" onclick="togglePassword('new_password', this)">
                        <i class="far fa-eye"></i>
                    </button>
                </div>

                <!-- Confirm Password -->
                <div class="relative">
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Confirm Password</label>
                    <input type="password" name="confirm_password" id="confirm_password"
                        class="peer w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 shadow-sm transition" 
                        required>
                    <button type="button" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 dark:text-gray-300 hover:text-indigo-500 focus:outline-none" onclick="togglePassword('confirm_password', this)">
                        <i class="far fa-eye"></i>
                    </button>
                </div>

                <!-- Buttons -->
                <div class="flex justify-end gap-3">
                    <a href="{{ url_for('user_management_web.manage_users') }}" 
                        class="px-5 py-3 rounded-lg border border-gray-300 dark:border-gray-700 text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600 font-medium transition">
                        Cancel
                    </a>
                    <button type="submit" 
                        class="px-5 py-3 rounded-lg bg-gradient-to-r from-indigo-600 to-indigo-500 text-white font-semibold shadow-lg hover:from-indigo-700 hover:to-indigo-600 transition">
                        Update Password
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

<!-- JS for toggling password visibility -->
<script>
function togglePassword(fieldId, btn) {
    const input = document.getElementById(fieldId);
    if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<i class="far fa-eye-slash"></i>';
    } else {
        input.type = 'password';
        btn.innerHTML = '<i class="far fa-eye"></i>';
    }
}
</script>
{% endblock %}
