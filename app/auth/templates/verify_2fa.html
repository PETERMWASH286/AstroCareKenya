{% extends "base.html" %} {% block content %}
<div class="container py-5">
    <h2>Verify Your {{ method.method|title }}</h2>
    <p>We sent a verification code to: <strong>{{ method.destination }}</strong></p>

    <form method="POST">
        <div class="form-group">
            <label>Enter 6-digit code</label>
            <input type="text" name="code" class="form-control" placeholder="123456" required maxlength="6">
        </div>

        <button type="submit" class="btn btn-primary">Verify</button>
        <button type="button" class="btn btn-link" id="resend-code">Resend Code</button>
    </form>
</div>

<script>
    document.getElementById('resend-code').addEventListener('click', function() {
        fetch("{{ url_for('auth_web.resend_2fa_code', method_id=method.id) }}")
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('New code sent successfully!');
                }
            });
    });
</script>
{% endblock %}
