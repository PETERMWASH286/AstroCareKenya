{% extends "base.html" %} {% block title %}New Lab Test Request - AstroCare HMS{% endblock %} {% block content %}
<div class="min-h-screen bg-gray-50 dark:bg-gray-900">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-sm">
            <h2 class="text-2xl font-bold mb-6 text-gray-900 dark:text-white">New Lab Test Request</h2>

            <form method="POST">
                <div class="space-y-6">
                    <!-- Patient Selection -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
              Patient
            </label>
                        <select name="patient_id" required class="w-full rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 px-4 py-2">
              {% for patient in patients %}
              <option value="{{ patient.id }}">
                {{ patient.full_name }} ({{ patient.reg_no }})
              </option>
              {% endfor %}
            </select>
                    </div>

                    <!-- Test Selection -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
              Laboratory Test
            </label>
                        <select name="service_id" required class="w-full rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 px-4 py-2">
              {% for service in services %}
              <option value="{{ service.id }}">
                {{ service.name }}
              </option>
              {% endfor %}
            </select>
                    </div>

                    <!-- Form Actions -->
                    <div class="flex justify-end space-x-4">
                        <a href="{{ url_for('lab_web.list_lab_tests') }}" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-gray-50">
              Cancel
            </a>
                        <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
              Create Request
            </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
