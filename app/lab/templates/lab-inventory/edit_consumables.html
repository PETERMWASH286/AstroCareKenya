{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto py-10">
  <h1 class="text-3xl font-extrabold text-gray-900 mb-6">
    Edit Consumables for {{ test.test_name }}
  </h1>

  <form id="editConsumablesForm" class="space-y-6">
    <div id="consumablesList" class="space-y-4">
      {% if current_consumables %}
        {% for c in current_consumables %}
          <div class="flex items-center space-x-4">
            <select name="inventory_id" class="w-2/3 rounded-lg border-gray-300 shadow-sm">
              {% for item in inventory_items %}
                <option value="{{ item.id }}" {% if item.id == c.inventory_id %}selected{% endif %}>
                  {{ item.item_name }} ({{ item.quantity }} available)
                </option>
              {% endfor %}
            </select>
            <input type="number" name="quantity_used" min="1" value="{{ c.quantity_used }}"
                   class="w-1/3 rounded-lg border-gray-300 shadow-sm" />
            <button type="button" class="removeRow px-3 py-1 rounded-lg bg-red-100 text-red-700 hover:bg-red-200 transition text-sm">
              🗑
            </button>
          </div>
        {% endfor %}
      {% else %}
        <div class="flex items-center space-x-4">
          <select name="inventory_id" class="w-2/3 rounded-lg border-gray-300 shadow-sm">
            {% for item in inventory_items %}
              <option value="{{ item.id }}">{{ item.item_name }} ({{ item.quantity }} available)</option>
            {% endfor %}
          </select>
          <input type="number" name="quantity_used" min="1" value="1"
                 class="w-1/3 rounded-lg border-gray-300 shadow-sm" />
          <button type="button" class="removeRow px-3 py-1 rounded-lg bg-red-100 text-red-700 hover:bg-red-200 transition text-sm">
            🗑
          </button>
        </div>
      {% endif %}
    </div>

    <button type="button" id="addRow"
            class="px-4 py-2 bg-blue-500 text-white rounded-lg shadow hover:bg-blue-600 transition">
      + Add another
    </button>

    <div class="pt-6">
      <button type="submit"
              class="w-full px-4 py-2 bg-green-600 text-white font-semibold rounded-lg shadow hover:bg-green-700 transition">
        Save Changes
      </button>
    </div>
  </form>
</div>

<script>
document.getElementById("addRow").addEventListener("click", () => {
  const list = document.getElementById("consumablesList");
  const firstRow = list.firstElementChild.cloneNode(true);

  // Reset values
  firstRow.querySelector("input[name='quantity_used']").value = 1;
  firstRow.querySelector("select[name='inventory_id']").selectedIndex = 0;

  list.appendChild(firstRow);
});

// Remove a consumable row
document.getElementById("consumablesList").addEventListener("click", (e) => {
  if (e.target.classList.contains("removeRow")) {
    const rows = document.querySelectorAll("#consumablesList > div");
    if (rows.length > 1) {
      e.target.parentElement.remove();
    } else {
      alert("At least one consumable is required.");
    }
  }
});

// Handle form submission
document.getElementById("editConsumablesForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const consumables = [];
  document.querySelectorAll("#consumablesList > div").forEach(row => {
    consumables.push({
      inventory_id: row.querySelector("select").value,
      quantity_used: row.querySelector("input").value
    });
  });

  const res = await fetch("", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ consumables })
  });

  const data = await res.json();
  if (data.success) {
    alert(data.message);
    window.location.href = "{{ url_for('lab_web.manage_consumables') }}";
  } else {
    alert("Error: " + data.error);
  }
});
</script>
{% endblock %}
