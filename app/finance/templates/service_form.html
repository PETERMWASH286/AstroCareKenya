{% extends "base.html" %} {% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Card Container -->
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg overflow-hidden">
        <div class="px-6 py-8">
            <!-- Header -->
            <div class="flex items-center justify-between mb-6">
                <div>
                    {% if action == 'add' %}
                    <h2 class="text-2xl font-bold text-gray-900 dark:text-gray-100">Add New Service</h2>
                    <p class="mt-1 text-gray-600 dark:text-gray-400">Enter details for the new service.</p>
                    {% else %}
                    <h2 class="text-2xl font-bold text-gray-900 dark:text-gray-100">Edit Service</h2>
                    <p class="mt-1 text-gray-600 dark:text-gray-400">Update details for <span class="italic">{{ service.name }}</span>.</p>
                    {% endif %}
                </div>
                <a href="{{ url_for('finance_web_bp.manage_services_prices') }}" class="inline-flex items-center px-4 py-2 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 transition-all" data-tippy-content="Back to Service List">
                    <i class="fas fa-arrow-left mr-2"></i> Back
                </a>
            </div>

            <!-- Form -->
            <form action="{% if action == 'add' %}{{ url_for('finance_web_bp.add_service_price') }}{% else %}{{ url_for('finance_web_bp.edit_service_price', service_id=service.id) }}{% endif %}" method="POST" class="space-y-6">
                <!-- CSRF token if using one (uncomment if applicable) -->
                {# {{ csrf_token() }} #}

                <!-- Service Name -->
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Service Name<span class="text-red-500">*</span></label>
                    <input type="text" id="name" name="name" value="{{ service.name if service else '' }}" required class="mt-1 block w-full px-4 py-2 border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="e.g., General Consultation" />
                </div>

                <!-- Category -->
                <div>
                    <label for="category" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Category<span class="text-red-500">*</span></label>
                    <div class="relative mt-1">
                        <select id="category" name="category" required class="block w-full px-4 py-2 pr-8 border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none">
              <option value="" disabled {% if not service or not service.category %}selected{% endif %}>Select or type category</option>
              {% for cat in categories %}
                <option
                  value="{{ cat }}"
                  {% if service and service.category == cat %}selected{% endif %}
                >{{ cat }}</option>
              {% endfor %}
            </select>
                        <i class="fas fa-chevron-down absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 dark:text-gray-500 pointer-events-none"></i>
                    </div>
                </div>

                <!-- Description -->
                <div>
                    <label for="description" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Description</label>
                    <textarea id="description" name="description" rows="3" class="mt-1 block w-full px-4 py-2 border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Optional service description…">{{ service.description if service else '' }}</textarea>
                </div>

                <!-- Price & Duration Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <!-- Price -->
                    <div>
                        <label for="price" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Price (KES)<span class="text-red-500">*</span></label>
                        <input type="number" id="price" name="price" step="0.01" min="0" value="{{ service.price if service else '' }}" required class="mt-1 block w-full px-4 py-2 border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="e.g., 1500.00" />
                    </div>
                    <!-- Duration -->
                    <div>
                        <label for="duration" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Duration<span class="text-gray-400 text-xs"> (mins or days)</span></label>
                        <input type="number" id="duration" name="duration" min="0" value="{{ service.duration if service else '' }}" class="mt-1 block w-full px-4 py-2 border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="e.g., 30" />
                    </div>
                </div>

                <!-- Active Toggle -->
                <div class="flex items-center">
                    <input id="is_active" name="is_active" type="checkbox" class="h-4 w-4 text-green-600 border-gray-300 dark:border-gray-600 rounded focus:ring-green-500" {% if service and service.is_active %}checked{% elif not service %}checked{% endif %} />
                    <label for="is_active" class="ml-2 block text-sm font-medium text-gray-700 dark:text-gray-300">Active</label>
                </div>

                <!-- Submit & Cancel Buttons -->
                <div class="flex justify-end space-x-4 pt-4 border-t border-gray-200 dark:border-gray-700">
                    <a href="{{ url_for('finance_web_bp.manage_services_prices') }}" class="inline-flex items-center px-6 py-2 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 transition-all">
            Cancel
          </a>
                    <button type="submit" class="inline-flex items-center px-6 py-2 bg-blue-600 dark:bg-blue-500 text-white rounded-lg hover:bg-blue-700 dark:hover:bg-blue-600 transition-all">
            {% if action == 'add' %}<i class="fas fa-plus mr-2"></i> Create
            {% else %}<i class="fas fa-save mr-2"></i> Update{% endif %}
          </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Optional: Tippy.js for tooltips -->
<link rel="stylesheet" href="https://unpkg.com/tippy.js@6/dist/tippy.css" />
<script src="https://unpkg.com/@popperjs/core@2"></script>
<script src="https://unpkg.com/tippy.js@6"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        tippy('[data-tippy-content]', {
            theme: 'light-border',
            delay: [100, 50],
            animation: 'scale',
            arrow: true
        });
    });
</script>
{% endblock %}
