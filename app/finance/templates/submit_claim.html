{% extends 'base.html' %} {% block title %}Submit Insurance Claim{% endblock %} {% block content %}
<div class="min-h-screen bg-gradient-to-tr from-blue-50 via-white to-indigo-100 dark:from-gray-900 dark:via-gray-800 dark:to-gray-900 px-6 py-12">
    <div class="max-w-3xl mx-auto bg-white dark:bg-gray-800/60 backdrop-blur-md shadow-xl rounded-3xl p-10 border border-gray-200 dark:border-gray-700 relative">

        <!-- Header -->
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold text-gray-800 dark:text-white tracking-tight mb-2">
                Submit Insurance Claim
            </h1>
            <p class="text-sm text-gray-500 dark:text-gray-300">Invoice #{{ invoice.id }} | Patient: {{ invoice.patient.full_name }}</p>
        </div>

        <!-- Claim Form -->
        <form method="POST" action="" class="space-y-6">
            <!-- CSRF if using Flask-WTF -->
            {{ form.csrf_token() if form and form.csrf_token }}

            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">Claim Reference <span class="text-red-500">*</span></label>
                <input type="text" name="claim_reference" required placeholder="e.g., CLM-20240605-XYZ" class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl shadow-sm text-gray-800 dark:text-white placeholder:text-gray-400 dark:placeholder:text-gray-400 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                />
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">Submitted By <span class="text-red-500">*</span></label>
                <input type="text" name="submitted_by" required placeholder="Name of the staff" class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl shadow-sm text-gray-800 dark:text-white placeholder:text-gray-400 dark:placeholder:text-gray-400 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                />
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">Additional Notes</label>
                <textarea name="notes" rows="4" placeholder="Optional: Include any relevant details here..." class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl shadow-sm text-gray-800 dark:text-white placeholder:text-gray-400 dark:placeholder:text-gray-400 focus:ring-2 focus:ring-indigo-500 focus:outline-none resize-y"></textarea>
            </div>

            <!-- Submit Button -->
            <div class="flex justify-between items-center mt-6">
                <a href="{{ url_for('finance_web_bp.invoices', invoice_id=invoice.id) }}" class="text-sm text-indigo-600 hover:underline dark:text-indigo-400">
          ← Back to Invoice
        </a>
                <button type="submit" class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm px-6 py-3 rounded-xl shadow-lg transition-all">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2"
               viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M5 13l4 4L19 7"></path>
          </svg>
          Submit Claim
        </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
