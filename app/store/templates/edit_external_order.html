{% extends "base.html" %}
{% block title %}Edit External Order{% endblock %}
{% block content %}

<div class="min-h-screen p-6 md:p-8 bg-gray-50 dark:bg-gray-900">
  <div class="max-w-5xl mx-auto bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-6 md:p-10">
    <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-100 mb-6 flex items-center">
      <i class="fas fa-edit text-indigo-500 mr-3"></i> Edit External Order
    </h2>

    <form action="{{ url_for('store_web_bp.edit_external_order', order_id=order.id) }}" method="POST" id="editOrderForm" class="space-y-8">

      <!-- Item Details -->
      <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
        <div class="md:col-span-2">
          <label for="item_name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Item Name *</label>
          <input type="text" name="item_name" id="item_name" value="{{ order.item_name }}" required
                 class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
        </div>
        <div>
          <label for="quantity" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Quantity *</label>
          <input type="number" name="quantity" id="quantity" value="{{ order.quantity }}" min="1" required
                 oninput="calculateTotal()"
                 class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
        </div>
        <div>
          <label for="unit" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Unit</label>
          <select name="unit" id="unit"
                  class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            <option value="pcs" {{ 'selected' if order.unit == 'pcs' else '' }}>Pieces</option>
            <option value="kg" {{ 'selected' if order.unit == 'kg' else '' }}>Kilograms</option>
            <option value="m" {{ 'selected' if order.unit == 'm' else '' }}>Meters</option>
            <option value="l" {{ 'selected' if order.unit == 'l' else '' }}>Liters</option>
            <option value="set" {{ 'selected' if order.unit == 'set' else '' }}>Set</option>
          </select>
        </div>
      </div>



      <!-- Priority & Category -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label for="priority" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Priority Level *</label>
          <select name="priority" id="priority"
                  class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            <option value="low" {{ 'selected' if order.priority == 'low' else '' }}>Low</option>
            <option value="medium" {{ 'selected' if order.priority == 'medium' else '' }}>Medium</option>
            <option value="high" {{ 'selected' if order.priority == 'high' else '' }}>High</option>
            <option value="urgent" {{ 'selected' if order.priority == 'urgent' else '' }}>Urgent</option>
          </select>
        </div>
        <div>
          <label for="category" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Category *</label>
          <select name="category" id="category" required
                  class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            <option value="medication" {{ 'selected' if order.category == 'medication' else '' }}>Medication</option>
            <option value="medical_supplies" {{ 'selected' if order.category == 'medical_supplies' else '' }}>Medical Supplies</option>
            <option value="equipment" {{ 'selected' if order.category == 'equipment' else '' }}>Medical Equipment</option>
            <option value="surgical" {{ 'selected' if order.category == 'surgical' else '' }}>Surgical Instruments</option>
            <option value="lab" {{ 'selected' if order.category == 'lab' else '' }}>Laboratory Supplies</option>
            <option value="office" {{ 'selected' if order.category == 'office' else '' }}>Office Supplies</option>
            <option value="furniture" {{ 'selected' if order.category == 'furniture' else '' }}>Furniture</option>
            <option value="it" {{ 'selected' if order.category == 'it' else '' }}>IT Equipment</option>
            <option value="maintenance" {{ 'selected' if order.category == 'maintenance' else '' }}>Maintenance</option>
            <option value="consumables" {{ 'selected' if order.category == 'consumables' else '' }}>Consumables</option>
          </select>
        </div>
      </div>

      <!-- Notes -->
      <div>
        <label for="reason" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Reason / Notes *</label>
        <textarea name="reason" id="reason" rows="4" required
                  class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">{{ order.reason }}</textarea>
      </div>

      <!-- Actions -->
      <div class="flex justify-end space-x-3">
        <a href="{{ url_for('store_web_bp.external_orders') }}"
           class="px-6 py-3 rounded-xl border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 font-medium transition">
          Cancel
        </a>
        <button type="submit"
                class="bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white px-6 py-3 rounded-xl font-medium shadow-md transition transform hover:-translate-y-0.5 focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
          <i class="fas fa-save mr-2"></i> Update Order
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  function calculateTotal() {
    let qty = parseFloat(document.getElementById("quantity").value) || 0;
    let unitPrice = parseFloat(document.getElementById("unit_price").value) || 0;
    let taxRate = parseFloat(document.getElementById("tax_rate").value) || 0;

    let subtotal = qty * unitPrice;
    let tax = subtotal * (taxRate / 100);
    document.getElementById("total_price").value = (subtotal + tax).toFixed(2);
  }
</script>

{% endblock %}
