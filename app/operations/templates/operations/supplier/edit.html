{% extends "base.html" %}

{% block title %}Edit Supplier{% endblock %}

{% block content %}
<div class="container-fluid px-4 py-4">
    <!-- Header -->
    <div class="bg-gradient-primary text-white p-4 rounded-4 mb-4 shadow-sm">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center">
            <div>
                <h1 class="display-6 fw-bold">Edit Supplier</h1>
                <p class="text-white-80 mb-0">Update supplier information</p>
            </div>
            <div class="mt-3 mt-md-0">
                <a href="{{ url_for('operations_web_bp.supplier_list') }}" class="btn btn-light rounded-pill">
                    <i class="fas fa-arrow-left me-2"></i>Back to List
                </a>
            </div>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Supplier Name *</label>
                            <input type="text" name="name" class="form-control" value="{{ supplier.name }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contact Person</label>
                            <input type="text" name="contact_person" class="form-control" value="{{ supplier.contact_person or '' }}">
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Phone</label>
                                <input type="text" name="phone" class="form-control" value="{{ supplier.phone or '' }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control" value="{{ supplier.email or '' }}">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <textarea name="address" class="form-control" rows="2">{{ supplier.address or '' }}</textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Category</label>
                                <input type="text" name="category" class="form-control" value="{{ supplier.category or '' }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Rating (1-5)</label>
                                <select name="rating" class="form-select">
                                    <option value="5" {% if supplier.rating == 5 %}selected{% endif %}>5 ★</option>
                                    <option value="4" {% if supplier.rating == 4 %}selected{% endif %}>4 ★</option>
                                    <option value="3" {% if supplier.rating == 3 %}selected{% endif %}>3 ★</option>
                                    <option value="2" {% if supplier.rating == 2 %}selected{% endif %}>2 ★</option>
                                    <option value="1" {% if supplier.rating == 1 %}selected{% endif %}>1 ★</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Lead Time (days)</label>
                                <input type="number" name="lead_time_days" class="form-control" value="{{ supplier.lead_time_days or 7 }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Payment Terms</label>
                                <input type="text" name="payment_terms" class="form-control" value="{{ supplier.payment_terms or '' }}" placeholder="e.g., Net 30">
                            </div>
                        </div>
                        <div class="text-end">
                            <a href="{{ url_for('operations_web_bp.supplier_list') }}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .bg-gradient-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .text-white-80 {
        color: rgba(255,255,255,0.8);
    }
</style>
{% endblock %}
